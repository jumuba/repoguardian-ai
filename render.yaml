services:
  - type: web
    name: repoguardian-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/repoguardian.db
      - key: FRONTEND_URL
        value: https://repoguardian-ai-gray.vercel.app
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
