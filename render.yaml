services:
  - type: web
    name: repoguardian-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repoguardian-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://repoguardian-ai-gray.vercel.app
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: repoguardian-postgres
    databaseName: repoguardian
    user: repoguardian
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
